name: Chrona archive tests

on:
  push:
    branches: [main]
    paths:
      - 'chrona.py'
      - 'test_chrona.py'
      - '.github/workflows/chrona-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'chrona.py'
      - 'test_chrona.py'
      - '.github/workflows/chrona-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run Chrona archive tests
        run: python -m pytest -q test_chrona.py
